name: Localisation check

# Reusable pre-build check. Call it from the osu repository with:
#
#   jobs:
#     localisation:
#       uses: GooGuTeam/g0v0-l10n-checker/.github/workflows/localisation-check.yml@main
#       permissions:
#         contents: read
#         security-events: write   # only needed to publish the findings to code scanning
#
# Nothing has to be configured. A pull request is checked against the newest resources, because the
# two repositories are developed together and a release lags behind the branch under review; every
# other run is checked against the resources the build itself names. To pin one anyway, put a line
# in the pull request description:
#
#   Resources-Ref: v2026.1012.0-g0v0
#
# By default the caller's own repository is checked out as the osu side, so no extra credentials are
# needed beyond reading the (public) resources repository.
#
# The resources repository is the mirror image: it names the osu side explicitly and asks for the
# other half of the report.
#
#   jobs:
#     localisation:
#       uses: GooGuTeam/g0v0-l10n-checker/.github/workflows/localisation-check.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         osu-repository: GooGuTeam/g0v0
#         osu-ref: v2
#         resources-ref: ${{ github.sha }}   # the commit under test, never a derived default
#         sarif-source: resources
#
# The whole cross-check runs either way — both sides are needed to check anything. Only the SARIF
# report differs, because a SARIF location is a path relative to one repository, and the upload only
# ever targets the calling repository. One call therefore publishes the `*Strings.cs` findings, the
# other publishes the `.resx` ones.
#
# Results are reported three ways: inline annotations on the check run, a table in the job summary,
# and a SARIF file uploaded to code scanning, where the findings become alerts with a lifecycle of
# their own. The last one is best effort — see the upload step.

on:
  workflow_call:
    inputs:
      osu-repository:
        description: osu! repository to check. Leave empty to check the calling repository.
        type: string
        required: false
        default: ""
      osu-ref:
        description: Ref of the osu! repository. Ignored when osu-repository is empty.
        type: string
        required: false
        default: ""
      resources-repository:
        description: Repository holding the .resx files.
        type: string
        required: false
        default: GooGuTeam/g0v0-resources
      resources-ref:
        description: Ref of the resources repository, as a git ref. Empty takes a Resources-Ref line from the pull request description, and otherwise the newest resources on a pull request or the tag v<G0V0ResourcesVersion>-g0v0 outside one.
        type: string
        required: false
        default: ""
      extra-resx:
        description: Additional resx folder, in DIR[=ROOT_NAMESPACE] form.
        type: string
        required: false
        default: ""
      baseline:
        description: Baseline file to read. Empty disables baselines entirely.
        type: string
        required: false
        default: checker/.localisation-baseline.json
      fail-on:
        description: never | error | warning
        type: string
        required: false
        default: error
      sarif-source:
        description: Which side the SARIF report describes, osu | resources. Must match the calling repository.
        type: string
        required: false
        default: osu
    outputs:
      errors:
        description: Number of errors reported.
        value: ${{ jobs.check.outputs.errors }}
      warnings:
        description: Number of warnings reported.
        value: ${{ jobs.check.outputs.warnings }}
  workflow_dispatch:
    inputs:
      osu-repository:
        description: osu! repository to check.
        type: string
        default: GooGuTeam/g0v0
      resources-repository:
        description: Repository holding the .resx files.
        type: string
        default: GooGuTeam/g0v0-resources
      resources-ref:
        description: Ref of the resources repository. Empty uses the tag v<G0V0ResourcesVersion>-g0v0, a manual run never being a pull request.
        type: string
        default: ""
      extra-resx:
        description: Additional resx folder, in DIR[=ROOT_NAMESPACE] form.
        type: string
        default: ""
      fail-on:
        description: never | error | warning
        type: string
        default: error
      sarif-source:
        description: Which side the SARIF report describes, osu | resources.
        type: string
        default: osu

permissions:
  contents: read
  # Needed to upload the SARIF report to code scanning. A called workflow can only be granted what
  # the caller grants, so the calling job has to ask for this too or the upload is rejected with a
  # 403 — which is why the upload step below is tolerant of that rejection.
  security-events: write

jobs:
  check:
    name: Check localisation
    runs-on: ubuntu-latest
    outputs:
      errors: ${{ steps.summary.outputs.errors }}
      warnings: ${{ steps.summary.outputs.warnings }}
    steps:
      # The first checkout below reads an empty `osu-repository` as "the caller is the osu side". That
      # is exactly right for the osu repository and silently wrong for every other caller: the
      # resources repository would be scanned as if its `osu.Game.Resources/Localisation/*.resx` files
      # were `osu.Game/Localisation/*Strings.cs`, and the result is 100% noise. Stop before checking
      # anything out rather than publish that.
      - name: Refuse to cross-check a repository against itself
        if: ${{ inputs.osu-repository == '' }}
        env:
          CALLER: ${{ github.repository }}
          RESOURCES: ${{ inputs.resources-repository }}
        run: |
          if [ "${CALLER,,}" = "${RESOURCES,,}" ]; then
            echo "::error::$CALLER holds the .resx files, so it has to name the osu side explicitly with the osu-repository input"
            exit 1
          fi

      - name: Check out the calling repository as the osu! side
        if: ${{ inputs.osu-repository == '' }}
        uses: actions/checkout@v7
        with:
          path: osu

      - name: Check out the configured osu! repository
        if: ${{ inputs.osu-repository != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.osu-repository }}
          ref: ${{ inputs.osu-ref }}
          path: osu

      # Which resources to compare against. Three answers, in order of precedence:
      #
      #  1. the caller's explicit `resources-ref` input, read by the checkout below and deliberately
      #     not repeated here: the resources repository passes the commit under test, and nothing may
      #     override that;
      #  2. a `Resources-Ref:` line in the pull request description, for the cases the default does
      #     not fit — a resources branch, a specific commit, an older release;
      #  3. the default below, which depends on why the workflow ran.
      #
      # A pull request is checked against the newest resources rather than against a release. The two
      # repositories are developed together, so the branch under review normally wants the resources
      # that go with it, and a release predates them: resolving `G0V0ResourcesVersion` would pin the
      # check to the last published package and report every key the branch adds as missing — noise
      # about the change under review rather than a finding about it.
      #
      # Every other run keeps that derivation, because there the question is the opposite one: does
      # the pair that will actually ship agree? `G0V0ResourcesVersion` names exactly the resources the
      # build references, and the repository tags every release `v<version>-g0v0` (its release
      # workflow strips both the `v` and the `-g0v0` before publishing), so the property maps
      # one-to-one onto a tag.
      - name: Resolve the resources ref
        id: resources
        if: ${{ inputs.resources-ref == '' }}
        env:
          RESOURCES: ${{ inputs.resources-repository }}
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          repo="https://github.com/${RESOURCES}.git"

          # One listing answers every question asked below: does a ref a human typed exist, and which
          # commit the default branch is on. `--symref` adds the line naming the branch HEAD points
          # at, which is what makes the default branch resolvable without hard-coding `master`.
          refs=""
          if refs=$(git ls-remote --symref "$repo" 2>/dev/null); then
            echo "listed the refs in ${RESOURCES}"
          else
            echo "::warning::could not list the refs in ${RESOURCES}; a ref that cannot be confirmed is left to the checkout below to reject"
          fi

          ref=""
          label=""
          source=""

          # A plain line rather than a checkbox, so it survives any pull request template. Markdown
          # decoration around it is tolerated — the line is read through it rather than parsed.
          #
          #   Resources-Ref: v2026.1012.0-g0v0
          #
          # It arrives through the environment instead of being interpolated into this script: a pull
          # request description is text anyone can write, and it must never reach the shell as code.
          if [ -n "${PR_BODY:-}" ]; then
            if line=$(grep -iE -m1 '^[[:space:]]*[`"]*[[:space:]]*resources-ref[[:space:]]*:' <<<"$PR_BODY"); then
              ref=$(sed 's/^[^:]*://' <<<"$line" | tr -d '`"' | tr -d '[:space:]')
            fi

            if [ -n "$ref" ]; then
              label="$ref"
              source="from the pull request description"
              echo "the pull request description asks for the resources ref ${ref}"

              # A typo would otherwise surface as a bare "couldn't find remote ref" from the
              # checkout, with nothing said about what was meant. A commit hash cannot be confirmed
              # from a listing that advertises only refs, so it is taken on trust and named as such.
              if [ -n "$refs" ] && [ -z "$(awk -v t="refs/tags/${ref}" -v b="refs/heads/${ref}" \
                  '$2 == t || $2 == b { print "yes"; exit }' <<<"$refs")" ]; then
                case "$ref" in
                  *[!0-9a-fA-F]*)
                    echo "::error::${RESOURCES} has neither a tag nor a branch called ${ref}, which the pull request description asks for"
                    near=$(awk -v v="$ref" '{ sub("refs/(tags|heads)/", "", $2); if (index($2, v)) print "    " $2 }' <<<"$refs")
                    if [ -n "$near" ]; then
                      echo "::error::refs in ${RESOURCES} mentioning ${ref}:"
                      echo "$near"
                    fi
                    exit 1
                    ;;
                  *)
                    if [ "${#ref}" -lt 7 ]; then
                      echo "::error::${ref} is neither a tag nor a branch in ${RESOURCES}, and too short to be a commit hash"
                      exit 1
                    fi
                    echo "::notice::${RESOURCES} has no ref called ${ref}; taking it for a commit hash and letting the checkout fetch it"
                    ;;
                esac
              fi
            fi
          fi

          # Nothing was named, so it comes down to why the workflow ran.
          if [ -z "$ref" ] && [ "$EVENT" = "pull_request" ]; then
            # A pull request is never checked against a derived release tag — not even when the
            # listing above failed, which is why this is an `elif` below rather than a second guard.
            # The newest resources are what a branch was written against. The commit is resolved
            # instead of leaving the branch to move underneath, so the ref named in the summary and
            # the ref checked out below cannot turn out to be two different things.
            label="the default branch"
            source="the newest resources, not a release"
            if [ -n "$refs" ]; then
              sha=$(awk '$2 == "HEAD" { print $1; exit }' <<<"$refs")
              if [ -n "$sha" ]; then
                branch=$(awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }' <<<"$refs")
                ref="$sha"
                label="${branch:-default}@$(cut -c 1-7 <<<"$sha")"
              fi
            fi
            echo "checking against ${label} of ${RESOURCES}"
          elif [ -z "$ref" ]; then
            # Relative to the workspace root, i.e. through the checkout's `path`, exactly as the
            # checker is pointed at it further down with `--osu osu`.
            csproj="osu/osu.Game/osu.Game.csproj"

            if [ ! -f "$csproj" ]; then
              echo "::error::$csproj does not exist, so G0V0ResourcesVersion cannot be read; pass resources-ref explicitly"
              exit 1
            fi

            version=$(sed -n 's:.*<G0V0ResourcesVersion[^>]*>\([^<]*\)</G0V0ResourcesVersion>.*:\1:p' "$csproj" | head -n 1 | tr -d '[:space:]')

            if [ -z "$version" ]; then
              echo "::error::no G0V0ResourcesVersion in $csproj; pass resources-ref explicitly"
              exit 1
            fi

            ref="v${version}-g0v0"
            label="$ref"
            source="from G0V0ResourcesVersion ${version} in the osu! csproj"
            echo "$csproj has G0V0ResourcesVersion $version, published as the tag $ref"

            # A missing tag would otherwise end the checkout below with a bare "couldn't find remote
            # ref". Say which version asked for it and which tags do exist: the usual cause is a
            # version bumped here before the resources were released, and the tag it should have been
            # is then obvious from the list.
            if [ -n "$refs" ] && [ -z "$(awk -v want="refs/tags/$ref" '$2 == want { print "yes"; exit }' <<<"$refs")" ]; then
              echo "::error::${RESOURCES} has no tag ${ref}, which is what G0V0ResourcesVersion ${version} resolves to"
              near=$(awk -v v="$version" '{ sub("refs/tags/", "", $2); if (index($2, v)) print "    " $2 }' <<<"$refs")
              if [ -n "$near" ]; then
                echo "::error::existing tags mentioning ${version}:"
                echo "$near"
              fi
              exit 1
            fi
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Check out the resources repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.resources-repository }}
          ref: ${{ inputs.resources-ref || steps.resources.outputs.ref }}
          path: resources

      - name: Check out the checker
        uses: actions/checkout@v7
        with:
          repository: GooGuTeam/g0v0-l10n-checker
          path: checker

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run the checker
        id: run
        run: |
          baseline_args="--no-baseline"
          if [ -n "${{ inputs.baseline }}" ]; then
            baseline_args="--baseline ${{ inputs.baseline }}"
          fi

          extra_args=""
          if [ -n "${{ inputs.extra-resx }}" ]; then
            extra_args="--extra-resx ${{ inputs.extra-resx }}"
          fi

          # --fail-on never keeps this step green so the annotations are always emitted; the summary
          # step below decides whether the job itself fails.
          #
          # The SARIF report is written from the same run but is deliberately not subject to the
          # baseline: code scanning keeps its own alert state, and the known issues are exactly what
          # deserves to be listed there for triage. It only ever contains the side named by
          # `sarif-source` — the one whose repository this is.
          dotnet run --project checker/src/g0v0.LocalisationChecker -c Release -- \
            --osu osu \
            --resources resources \
            --format github \
            --color never \
            --fail-on never \
            $baseline_args \
            $extra_args \
            --json-report "$RUNNER_TEMP/localisation.json" \
            --sarif-report "$RUNNER_TEMP/localisation.sarif" \
            --sarif-source "${{ inputs.sarif-source }}"

      - name: Summarise
        id: summary
        env:
          # The ref the resources checkout resolved to, named the way the resolve step named it, so
          # the summary reports the pair that was actually compared rather than the pair the caller
          # asked for. The step is skipped when the caller passed an explicit ref, hence the
          # fall-backs below.
          RESOURCES_REF: ${{ inputs.resources-ref || steps.resources.outputs.label }}
          RESOURCES_SOURCE: ${{ steps.resources.outputs.source }}
        run: |
          errors=$(jq '.summary.error' "$RUNNER_TEMP/localisation.json")
          warnings=$(jq '.summary.warning' "$RUNNER_TEMP/localisation.json")
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "warnings=$warnings" >> "$GITHUB_OUTPUT"

          {
            echo "## Localisation check"
            echo
            echo "| severity | count |"
            echo "| --- | --- |"
            echo "| error | $errors |"
            echo "| warning | $warnings |"
            echo "| info | $(jq '.summary.info' "$RUNNER_TEMP/localisation.json") |"
            echo "| suppressed by baseline | $(jq '.summary.suppressed' "$RUNNER_TEMP/localisation.json") |"
            echo
            echo "Checked $(jq '.summary.classes' "$RUNNER_TEMP/localisation.json") localisation classes against $(jq '.summary.resources' "$RUNNER_TEMP/localisation.json") resource files."
            echo
            echo "Resources: \`${RESOURCES_REF:-unresolved}\` in ${{ inputs.resources-repository }} (${RESOURCES_SOURCE:-passed by the caller})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Code scanning is where GitHub lists third-party findings, and it is the only place an alert
      # outlives the run. The report holds one repository's side (see `sarif-source`), which is also
      # the repository this upload lands in — so every path in it resolves.
      #
      # Three things can go wrong, and none of them may turn the check red:
      #
      #  * a pull request from a fork gets a read-only token that `permissions:` cannot widen, so the
      #    upload is skipped there;
      #  * a caller that has not granted `security-events: write` gets a 403;
      #  * uploading is optional anyway — the annotations above are the gate.
      - name: Upload the report to code scanning
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/localisation.sarif

      - name: Fail when the threshold is exceeded
        if: ${{ inputs.fail-on != 'never' }}
        run: |
          errors=${{ steps.summary.outputs.errors }}
          warnings=${{ steps.summary.outputs.warnings }}

          if [ "${{ inputs.fail-on }}" = "warning" ] && { [ "$errors" -gt 0 ] || [ "$warnings" -gt 0 ]; }; then
            echo "::error::localisation check failed: $errors error(s), $warnings warning(s)"
            exit 1
          fi

          if [ "${{ inputs.fail-on }}" = "error" ] && [ "$errors" -gt 0 ]; then
            echo "::error::localisation check failed: $errors error(s)"
            exit 1
          fi
