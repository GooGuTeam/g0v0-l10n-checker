name: Localisation check

# Reusable pre-build check. Call it from the osu repository with:
#
#   jobs:
#     localisation:
#       uses: GooGuTeam/g0v0-l10n-checker/.github/workflows/localisation-check.yml@main
#       permissions:
#         contents: read
#         security-events: write   # only needed to publish the findings to code scanning
#       with:
#         resources-ref: "v2026.1012.0-g0v0"   # the tag that published G0V0ResourcesVersion
#
# By default the caller's own repository is checked out as the osu side, so no extra credentials are
# needed beyond reading the (public) resources repository.
#
# The resources repository is the mirror image: it names the osu side explicitly and asks for the
# other half of the report.
#
#   jobs:
#     localisation:
#       uses: GooGuTeam/g0v0-l10n-checker/.github/workflows/localisation-check.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         osu-repository: GooGuTeam/g0v0
#         osu-ref: v2
#         resources-ref: ${{ github.sha }}   # the commit under test, not the default branch
#         sarif-source: resources
#
# The whole cross-check runs either way — both sides are needed to check anything. Only the SARIF
# report differs, because a SARIF location is a path relative to one repository, and the upload only
# ever targets the calling repository. One call therefore publishes the `*Strings.cs` findings, the
# other publishes the `.resx` ones.
#
# Results are reported three ways: inline annotations on the check run, a table in the job summary,
# and a SARIF file uploaded to code scanning, where the findings become alerts with a lifecycle of
# their own. The last one is best effort — see the upload step.

on:
  workflow_call:
    inputs:
      osu-repository:
        description: osu! repository to check. Leave empty to check the calling repository.
        type: string
        required: false
        default: ""
      osu-ref:
        description: Ref of the osu! repository. Ignored when osu-repository is empty.
        type: string
        required: false
        default: ""
      resources-repository:
        description: Repository holding the .resx files.
        type: string
        required: false
        default: GooGuTeam/g0v0-resources
      resources-ref:
        description: Ref of the resources repository, as a git ref, referencing the tag that published G0V0ResourcesVersion.
        type: string
        required: false
        default: ""
      extra-resx:
        description: Additional resx folder, in DIR[=ROOT_NAMESPACE] form.
        type: string
        required: false
        default: ""
      baseline:
        description: Baseline file to read. Empty disables baselines entirely.
        type: string
        required: false
        default: checker/.localisation-baseline.json
      fail-on:
        description: never | error | warning
        type: string
        required: false
        default: error
      sarif-source:
        description: Which side the SARIF report describes, osu | resources. Must match the calling repository.
        type: string
        required: false
        default: osu
    outputs:
      errors:
        description: Number of errors reported.
        value: ${{ jobs.check.outputs.errors }}
      warnings:
        description: Number of warnings reported.
        value: ${{ jobs.check.outputs.warnings }}
  workflow_dispatch:
    inputs:
      osu-repository:
        description: osu! repository to check.
        type: string
        default: GooGuTeam/g0v0
      resources-repository:
        description: Repository holding the .resx files.
        type: string
        default: GooGuTeam/g0v0-resources
      resources-ref:
        description: Ref of the resources repository.
        type: string
        default: ""
      extra-resx:
        description: Additional resx folder, in DIR[=ROOT_NAMESPACE] form.
        type: string
        default: ""
      fail-on:
        description: never | error | warning
        type: string
        default: error
      sarif-source:
        description: Which side the SARIF report describes, osu | resources.
        type: string
        default: osu

permissions:
  contents: read
  # Needed to upload the SARIF report to code scanning. A called workflow can only be granted what
  # the caller grants, so the calling job has to ask for this too or the upload is rejected with a
  # 403 — which is why the upload step below is tolerant of that rejection.
  security-events: write

jobs:
  check:
    name: Check localisation
    runs-on: ubuntu-latest
    outputs:
      errors: ${{ steps.summary.outputs.errors }}
      warnings: ${{ steps.summary.outputs.warnings }}
    steps:
      # The first checkout below reads an empty `osu-repository` as "the caller is the osu side". That
      # is exactly right for the osu repository and silently wrong for every other caller: the
      # resources repository would be scanned as if its `osu.Game.Resources/Localisation/*.resx` files
      # were `osu.Game/Localisation/*Strings.cs`, and the result is 100% noise. Stop before checking
      # anything out rather than publish that.
      - name: Refuse to cross-check a repository against itself
        if: ${{ inputs.osu-repository == '' }}
        env:
          CALLER: ${{ github.repository }}
          RESOURCES: ${{ inputs.resources-repository }}
        run: |
          if [ "${CALLER,,}" = "${RESOURCES,,}" ]; then
            echo "::error::$CALLER holds the .resx files, so it has to name the osu side explicitly with the osu-repository input"
            exit 1
          fi

      - name: Check out the calling repository as the osu! side
        if: ${{ inputs.osu-repository == '' }}
        uses: actions/checkout@v7
        with:
          path: osu

      - name: Check out the configured osu! repository
        if: ${{ inputs.osu-repository != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.osu-repository }}
          ref: ${{ inputs.osu-ref }}
          path: osu

      - name: Check out the resources repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.resources-repository }}
          ref: ${{ inputs.resources-ref }}
          path: resources

      - name: Check out the checker
        uses: actions/checkout@v7
        with:
          repository: GooGuTeam/g0v0-l10n-checker
          path: checker

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run the checker
        id: run
        run: |
          baseline_args="--no-baseline"
          if [ -n "${{ inputs.baseline }}" ]; then
            baseline_args="--baseline ${{ inputs.baseline }}"
          fi

          extra_args=""
          if [ -n "${{ inputs.extra-resx }}" ]; then
            extra_args="--extra-resx ${{ inputs.extra-resx }}"
          fi

          # --fail-on never keeps this step green so the annotations are always emitted; the summary
          # step below decides whether the job itself fails.
          #
          # The SARIF report is written from the same run but is deliberately not subject to the
          # baseline: code scanning keeps its own alert state, and the known issues are exactly what
          # deserves to be listed there for triage. It only ever contains the side named by
          # `sarif-source` — the one whose repository this is.
          dotnet run --project checker/src/g0v0.LocalisationChecker -c Release -- \
            --osu osu \
            --resources resources \
            --format github \
            --color never \
            --fail-on never \
            $baseline_args \
            $extra_args \
            --json-report "$RUNNER_TEMP/localisation.json" \
            --sarif-report "$RUNNER_TEMP/localisation.sarif" \
            --sarif-source "${{ inputs.sarif-source }}"

      - name: Summarise
        id: summary
        run: |
          errors=$(jq '.summary.error' "$RUNNER_TEMP/localisation.json")
          warnings=$(jq '.summary.warning' "$RUNNER_TEMP/localisation.json")
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "warnings=$warnings" >> "$GITHUB_OUTPUT"

          {
            echo "## Localisation check"
            echo
            echo "| severity | count |"
            echo "| --- | --- |"
            echo "| error | $errors |"
            echo "| warning | $warnings |"
            echo "| info | $(jq '.summary.info' "$RUNNER_TEMP/localisation.json") |"
            echo "| suppressed by baseline | $(jq '.summary.suppressed' "$RUNNER_TEMP/localisation.json") |"
            echo
            echo "Checked $(jq '.summary.classes' "$RUNNER_TEMP/localisation.json") localisation classes against $(jq '.summary.resources' "$RUNNER_TEMP/localisation.json") resource files."
          } >> "$GITHUB_STEP_SUMMARY"

      # Code scanning is where GitHub lists third-party findings, and it is the only place an alert
      # outlives the run. The report holds one repository's side (see `sarif-source`), which is also
      # the repository this upload lands in — so every path in it resolves.
      #
      # Three things can go wrong, and none of them may turn the check red:
      #
      #  * a pull request from a fork gets a read-only token that `permissions:` cannot widen, so the
      #    upload is skipped there;
      #  * a caller that has not granted `security-events: write` gets a 403;
      #  * uploading is optional anyway — the annotations above are the gate.
      - name: Upload the report to code scanning
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/localisation.sarif

      - name: Fail when the threshold is exceeded
        if: ${{ inputs.fail-on != 'never' }}
        run: |
          errors=${{ steps.summary.outputs.errors }}
          warnings=${{ steps.summary.outputs.warnings }}

          if [ "${{ inputs.fail-on }}" = "warning" ] && { [ "$errors" -gt 0 ] || [ "$warnings" -gt 0 ]; }; then
            echo "::error::localisation check failed: $errors error(s), $warnings warning(s)"
            exit 1
          fi

          if [ "${{ inputs.fail-on }}" = "error" ] && [ "$errors" -gt 0 ]; then
            echo "::error::localisation check failed: $errors error(s)"
            exit 1
          fi
