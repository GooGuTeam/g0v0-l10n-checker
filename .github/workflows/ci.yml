name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build g0v0.LocalisationChecker.sln -c Release

      - name: Test
        run: dotnet test g0v0.LocalisationChecker.sln -c Release --no-build

      # The fixtures are a miniature osu / osu-resources pair whose only defect is one key that is
      # missing from the resource file. Checking them proves the CLI, the reporter and the exit code
      # all work end to end without needing either real repository.
      - name: Smoke test the CLI on fixtures
        run: |
          # --format is pinned rather than left on auto. Under GitHub Actions auto selects the github
          # reporter, which changes the output shape this assertion is written against and emits an
          # ::error annotation for a defect the fixture is *supposed* to have.
          dotnet run --project src/g0v0.LocalisationChecker -c Release --no-build -- \
            --osu tests/fixtures/osu \
            --resources tests/fixtures/resources \
            --format human \
            --color never \
            --no-baseline \
            --no-summary \
            --fail-on never > smoke.txt

          cat smoke.txt

          expected="osu.Game/Localisation/BrokenStrings.cs:20: error L10N001: key 'missing' is not defined in resource 'osu.Game.Resources.Localisation.Broken'"
          if ! grep -qxF "$expected" smoke.txt; then
            echo "::error::the fixture check did not report the expected diagnostic"
            exit 1
          fi

          if [ "$(wc -l < smoke.txt)" -ne 1 ]; then
            echo "::error::the fixtures should produce exactly one diagnostic"
            exit 1
          fi

      # The reusable workflow — and therefore the repository — consumes the github reporter and
      # the JSON report, so assert both shapes from this repository's own CI. The annotations are
      # written to a file and never echoed: emitting one from a *passing* step would surface a phantom
      # failure on the check run.
      - name: Smoke test the github and JSON reporters on fixtures
        run: |
          dotnet run --project src/g0v0.LocalisationChecker -c Release --no-build -- \
            --osu tests/fixtures/osu \
            --resources tests/fixtures/resources \
            --format github \
            --color never \
            --no-baseline \
            --no-summary \
            --fail-on never \
            --json-report report.json > github.txt

          expected="::error file=osu.Game/Localisation/BrokenStrings.cs,line=20,title=Missing resource key::key 'missing' is not defined in resource 'osu.Game.Resources.Localisation.Broken'"
          if ! grep -qxF "$expected" github.txt; then
            echo "::error::the github reporter did not emit the expected annotation"
            exit 1
          fi

          if [ "$(wc -l < github.txt)" -ne 1 ]; then
            echo "::error::--no-summary should leave exactly one line in github format"
            exit 1
          fi

          errors=$(jq '.summary.error' report.json)
          if [ "$errors" != "1" ]; then
            echo "::error::the JSON report should record one error, got '$errors'"
            exit 1
          fi

      # The reusable workflow uploads this file to code scanning, which rejects a report that is
      # missing any of the fields below. Assert the contract here so a failure shows up in this
      # repository's CI rather than in a caller's build.
      - name: Smoke test the SARIF reporter on fixtures
        run: |
          dotnet run --project src/g0v0.LocalisationChecker -c Release --no-build -- \
            --osu tests/fixtures/osu \
            --resources tests/fixtures/resources \
            --format human \
            --color never \
            --no-baseline \
            --no-summary \
            --fail-on never \
            --sarif-report localisation.sarif > /dev/null

          product=$(sed -n 's:.*<Product>\(.*\)</Product>.*:\1:p' Directory.Build.props)

          jq -e --arg product "$product" '
            .version == "2.1.0"
            and (.runs | length == 1)
            and (.runs[0].tool.driver.name == $product)
            and (.runs[0].tool.driver.rules | length > 0)
            and (.runs[0].tool.driver.rules | all(.shortDescription.text | length > 0))
            and (.runs[0].tool.driver.rules | all(.fullDescription.text | length > 0))
            and (.runs[0].tool.driver.rules | all(.help.text | length > 0))
            and (.runs[0].results | length == 1)
            and (.runs[0].results[0].ruleId == "L10N001")
            and (.runs[0].results[0].level == "error")
            and (.runs[0].results[0].message.text | contains("is not defined in resource"))
            and (.runs[0].results[0].locations[0].physicalLocation.artifactLocation.uri
                 == "osu.Game/Localisation/BrokenStrings.cs")
            and (.runs[0].results[0].locations[0].physicalLocation.region.startLine == 20)
            and (.runs[0].results[0].partialFingerprints.primaryLocationLineHash | length > 0)
          ' localisation.sarif

          # The report is rooted at the osu! repository, so the resources side must not leak into it:
          # its paths would resolve nowhere in the repository being scanned.
          resource_side=$(jq '[.runs[0].results[]
            | select(.locations[0].physicalLocation.artifactLocation.uri | startswith("osu.Game.Resources/"))]
            | length' localisation.sarif)
          if [ "$resource_side" != "0" ]; then
            echo "::error::the osu SARIF report contains $resource_side resource-side findings"
            exit 1
          fi

      # The version has a single source in Directory.Build.props, and a build-time override only works
      # if the whole chain is wired up. Assert the wiring — and read the expected value from the same
      # file, so bumping the version never means editing the CI config.
      - name: Check --version reflects the assembly metadata
        run: |
          product=$(sed -n 's:.*<Product>\(.*\)</Product>.*:\1:p' Directory.Build.props)
          declared=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)

          if [ -z "$product" ] || [ -z "$declared" ]; then
            echo "::error::Directory.Build.props no longer declares <Product> and <VersionPrefix>"
            exit 1
          fi

          # --version prints "<product> <version>[+<revision>]". The SDK appends the revision whenever
          # it can read the source revision from git, which it always can on a checkout made by
          # actions/checkout — so every assertion here compares only the part before the "+" and never
          # expects the suffix to be absent.
          actual=$(dotnet run --project src/g0v0.LocalisationChecker -c Release --no-build -- --version)

          if [ "${actual%%+*}" != "$product $declared" ]; then
            echo "::error::--version reported '$actual', expected '$product $declared'"
            exit 1
          fi

          # Rebuild with an explicit version, then run the already-built assembly so MSBuild's own
          # output cannot be mistaken for the tool's.
          dotnet build src/g0v0.LocalisationChecker -c Release -p:Version=9.9.9 --nologo --verbosity quiet

          overridden=$(dotnet run --project src/g0v0.LocalisationChecker -c Release --no-build -- --version)

          if [ "${overridden%%+*}" != "$product 9.9.9" ]; then
            echo "::error::-p:Version did not reach the reported version: $overridden"
            exit 1
          fi
